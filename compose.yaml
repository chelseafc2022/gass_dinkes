services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gass
      POSTGRES_USER: gass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gass_local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["gass_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gass"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["gass_redis:/data"]
volumes:
  gass_postgres:
  gass_redis:
